<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/culturama-favico.png">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>
<body>
    <main>
    <header>
        <img src="img/logo-culturama.png" alt="Logo Culturama">
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <!--FORMULÁRIO-->
        <form action="" method="get">
            <!--Dados pessoais-->
            <fieldset>
                <legend>Dados Pessoais</legend>
                <br>
                <label for="name">Nome</label>
                <input type="text" name="username" id="name" required>
                <br>
                <label for="age">Idade</label>
                <input type="number" id="age" name="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de Nascimento</label>
                <input type="date" id="birthDate" name="userBirthDate">
                <br>
                <label for="Email">Email</label>
                <input type="email" id="Email" name="userEmail" required>
                <br>
                <label for="PhoneNumber">Telefone</label>
                <input type="tel" id="PhoneNumber" n    ame="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD+número S/ Espaços/traços/Hífen">
                <br>
                <label for="Image">Upload de Foto</label>
                <input type="file" id="Image" accept="image/*" name="userImage">
                <br>
            </fieldset>
            <!--PERFIL-->
            <fieldset>
                <legend>Perfil</legend>
                <p>Gênero</p>
                <br>
                <div>
                    <input type="radio" id="Feminine"name="userGender" value="Feminino">
                    <label for="Feminine">Feminino</label>
                <br>
                
                    <input type="radio" id="Masculine"name="userGender" value="Masculino">
                    <label for="Masculine">Masculino</label>
                    <br>

                    <input type="radio" id="Not"name="userGender" value="Prefiro nãoresponder">
                    <label for="Not">Prefiro não responder<label>
                </div>
                <br><br>
                <div class="estadoCivel">
                    <label for="maritalStatus">Estado Civel<label>
                </div>
                <select name="userMatitalStatus"          id="maritalStatus">
                    <option value="notInformed">Selecione..</option>
                    <option value="Casado">Casado</option>
                    <option value="Solteiro">Solteiro<option>
                    <option value="Divorciado">Divorciado<option>
                </select>
                
                <br><br>
                <label for="State">Estado</label>
                <select name="userState" id="State" required>
                    <option value="notInformed">Selecione...</option>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="bahia">Bahia</option>
                    <option value="amazonas">Amazonas<option>
                    <option value="DistritoFederal">DistritoFederal</option>
                    <option value="EspiritoSanto">EspíritoSanto</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão<option>
                    <option value="MatoGrosso">Mato Grosso<option>
                    <option value="MatoGrossoDoSul">MatoGrosso do Sul</option>
                    <option value="MinasGerais">MinasGerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco<option>
                    <option value="piaui">Piauí</option>
                    <option value="RioDeJaneiro">Rio deJaneiro</option>
                    <option value="RioGrandeDoNorte">RioGrande do Norte</option>
                    <option value="RioGrandeDoSul">RioGrande do Sul</option>
                    <option value="rondonia">Rondônia<option>
                    <option value="roraima">Roraima</option>
                    <option value="santa catarina">SantaCatarina</option>
                    <option value="SaoPaulo">São Paulo<option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins<option>
                    <option value="ceara">Ceará</option>
                </select>
                    <br><br>
                    <label for="City">Cidade</label>
                    <input type="text" id="City" name="userCity" autocomplete="address-level2" placeholder="São Paulo", required>
            </fieldset>
            <!--Hábitos-->
            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Socias</p>
                <input type="checkbox" id="facebook"
                 name="social" value="Facebook">
                <label for="facebook">Facebook</label>
                <br>

                <input type="checkbox" id="instagram" name="social" value="Instagram">
                <label for="instagram">Instagram</label>
                <br>

                <input type="checkbox" id="LinkedIn" name="social" value="LinkedIn">
                <label for="LinkedIn">LinkedIn</label>
                <br>

                <input type="checkbox" id="twitter" name="social" value="X">
                <label for="twitter">X</label>
                <br><br>

                <label for="musicStyle">Estilo Musical</label>
                <input type="text" list="styleTypes" id="musicStyle" name="userMusicStyle">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Sertanejo">
                    <option value="Samba">
                    <option value="Pagode">
                </datalist>
                <br>
                 <label for="favoriteColor">Cor Favorita</label>
                 <input type="color" id="favoriteColor" name="userFavoriteColor">
            </fieldset>
            <fieldset>
            <legend>Dê sua opinião</legend>
            <br>
                
                <input type="radio" id="excellent" name="userOpnion" value="Ótimo">
                <label for="excellent">Ótimo</label>
                <br>
                
                <input type="radio" id="good" name="userOpnion" value="Bom">
                <label for="good">Bom</label>
                
                <br>

                <input type="radio" id="regular" name="userOpnion" value="Regular">
                <label for="regular">Regular</label>    
                
                <br>

                <input type="radio" id="bad" name="userOpnion" value="Ruim">
                <label for="bad">Ruim</label>
                <br>

                <textarea name="userOpnion" id="opnion" cols="30" rows="10" placeholder="Digite sua opinião...", required></textarea>
            </fieldset>
            <fieldset>
                <legend>Confirmações</legend>
                <input type="checkbox" name="confirmation" id="lgpd" value="LGPD" required>
                <label for="lgpd">Eu aceito participar da pesquisa</label><br>
                <input type="checkbox" name="email" id="result" value="Envio por email">
                <label for="result">Desejo receber os resultados por email</label>
            </fieldset>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </section>
    </main>
</body>
</html>
